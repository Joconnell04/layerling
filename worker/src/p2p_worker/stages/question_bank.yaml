  - id: style
    text: Which look?
    options:
      - {id: true_to_photo, label: True to the photo, prompt: realistic proportions true to the photos}
      - {id: chibi, label: "Chibi, big head", prompt: cute chibi proportions with a big head}
      - {id: cartoon, label: Cartoon, prompt: a cartoon style}

other:
  - id: size
    covers: target_size_mm
    text: How big should it be?
    options:
      - {id: small, label: "Small, 50 mm", sets: {target_size_mm: 50}}
      - {id: medium, label: "Medium, 75 mm", sets: {target_size_mm: 75}}
      - {id: large, label: "Large, 100 mm", sets: {target_size_mm: 100}}
  - id: style
    text: Which look?
    options:
      - {id: true_to_photo, label: True to the photo, prompt: realistic proportions true to the photos}
      - {id: stylized, label: Stylized, prompt: a stylized look}
      - {id: cartoon, label: Cartoon, prompt: a cartoon style}
  - id: base
    text: What should it stand on?
    options:
      - {id: round_base, label: Round base, addon: {kind: round_base}}
      - {id: no_base, label: No base, remove: round_base}
