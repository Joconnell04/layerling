    required: true
    covers: form
    text: Flat relief or 3D figure?
    options:
      - {id: flat, label: Flat relief, sets: {form: flat}}
      - {id: figure, label: 3D figure, sets: {form: figure}}
  - id: size
    covers: target_size_mm
    text: How big should the magnet be?
    options:
      - {id: small, label: "Small, 45 mm", sets: {target_size_mm: 45}}
      - {id: medium, label: "Medium, 60 mm", sets: {target_size_mm: 60}}
      - {id: large, label: "Large, 75 mm", sets: {target_size_mm: 75}}
  - id: framing
    text: What should it show?
    options:
      - {id: head_only, label: Just the head, prompt: just the head}
